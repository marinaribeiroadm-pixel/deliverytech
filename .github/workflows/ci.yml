name: CI Delivery API
run-name: CI (${{ inputs.environment || 'development' }}) by @${{ github.actor }}
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: choice
        default: development
        options:
          - development
          - homolog
          - production
 
permissions:
  contents: read
 
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'development' }}
 
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ vars.DB_NAME }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Validate required config
        env:
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          DB_NAME: ${{ vars.DB_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          missing=0
          for v in DB_ROOT_PASSWORD DB_NAME JWT_SECRET; do
            if [ -z "${!v}" ]; then echo "::error::$v está vazio"; missing=1; fi
          done
          exit $missing
 
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
 
      - name: Build with Maven
        run: mvn -B clean install -DskipTests
 
      - name: Build Docker image
        run: docker build -t delivery-api-app:latest .
 
      - name: Run Docker container
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          JWT_EXPIRATION: ${{ vars.JWT_EXPIRATION }}
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/${{ vars.DB_NAME }}?allowPublicKeyRetrieval=true&useSSL=false
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
        run: |
          docker run -d --name delivery-api --network host \
            -e JWT_SECRET \
            -e JWT_EXPIRATION \
            -e SPRING_DATASOURCE_URL \
            -e SPRING_DATASOURCE_USERNAME \
            -e SPRING_DATASOURCE_PASSWORD \
            -e SPRING_DATA_REDIS_HOST \
            -e SPRING_DATA_REDIS_PORT \
            delivery-api-app:latest
 
      - name: Wait for API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/actuator/health > /dev/null; then
              echo "API saudável"; exit 0
            fi
            sleep 2
          done
          echo "::error::API não ficou saudável em 60s"
          exit 1
 
      - name: Show logs on failure
        if: failure()
        run: |
          docker ps -a
          docker logs delivery-api || true