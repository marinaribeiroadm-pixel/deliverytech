# ============================================================
#  APLICAÇÃO
# ============================================================
spring.application.name=delivery-api
server.port=8080

# ============================================================
#  BANCO DE DADOS (MySQL)
# ============================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:deliverydb}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:delivery_user}
spring.datasource.password=${DB_PASSWORD:delivery_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
#  JPA / HIBERNATE
# ============================================================
# update: mantém os dados no MySQL entre restarts (evite create-drop aqui)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# ============================================================
#  INICIALIZAÇÃO DE DADOS (data.sql / schema.sql)
# ============================================================
# Com MySQL + ddl-auto=update, use 'never' após a carga inicial para evitar erro de chave duplicada
spring.sql.init.mode=never

# ============================================================
#  DEVTOOLS
# ============================================================
spring.devtools.restart.enabled=true

# ============================================================
#  LOGGING
# ============================================================
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ============================================================
#  JWT
# ============================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:400000}

# ============================================================
#  ACTUATOR, PROMETHEUS E OBSERVABILIDADE
# ============================================================
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/actuator

management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.prometheus.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.info.enabled=true

management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans

info.app.name=Sistema de Delivery
info.app.description=API REST para sistema de delivery com observabilidade
info.app.version=1.0.0
info.team.name=Equipe de Desenvolvimento
info.team.email=dev@delivery.co

# ============================================================
#  REDIS (CACHE DISTRIBUÍDO)
# ============================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}